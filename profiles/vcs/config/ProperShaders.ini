; CloudWorks/ProperShaders port for VCSNative, on by default as part of the Vice City
; look. Set Enabled=false to restore the unmodified game sky. Parameters marked PLACEHOLDER are the exact inputs that
; ProperShaders obtains from San Andreas timecycle/weather; they stay fixed here
; until their VCS guest-side sources are connected.
[VolumetricClouds]
Enabled=true
DownscaleDiv=4
Layers=2
ShadowSteps=8
Opacity=1.0
Speed=0.0
Brightness=1.0
RandomSeed=0.0

; PLACEHOLDER: weather-derived coverage for each physical cloud deck.
CoverageLow=0.52
CoverageMid=0.34
CoverageHigh=0.20

; PLACEHOLDER: timecycle sun/moon state.
SunDirectionX=0.38
SunDirectionY=-0.28
SunDirectionZ=0.88
SunColorR=1.0
SunColorG=0.94
SunColorB=0.86
DayProgression=0.88

; PLACEHOLDER: timecycle cloud/fog colours and weather density.
CloudBaseColorR=0.86
CloudBaseColorG=0.82
CloudBaseColorB=0.90
AtmosphereDensity=0.0
Mist=0.50
FogColorR=0.72
FogColorG=0.80
FogColorB=0.92
FogStart=4500.0

; ProperShaders temporal resolve controls.
TemporalBlend=0.50
TemporalDenoise=1.0
TemporalClamp=1.0

; Real SMAA 1x (Jimenez et al., three passes), replacing FXAA on the Vulkan
; backend. On by default.
[SMAA]
Enabled=true

; Color-only post effects, all on by default as part of the Vice City look. They run in the final grading pass.
; Removes color banding (gradients, dark areas) with a fixed noise pattern.
[Dither]
Enabled=true
Strength=1.0

; AMD FidelityFX Contrast Adaptive Sharpening.
[CAS]
Enabled=true
Sharpness=0.3

; VHS tape look: line wiggle plus horizontal chroma smear.
[VHS]
Enabled=false
Wiggle=0.03
Smear=1.0
WiggleSpeed=25.0

; Vice City palette that follows the in-game clock: pink-magenta light around
; sunrise and sunset, a violet-blue tint at night with extra saturation for
; neon. A grade only; the game's own lighting is untouched.
[TimeOfDayGrade]
Enabled=true
Strength=0.35

; Vice City sky by in-game hour: pink-magenta dawn and dusk, teal-cyan day,
; violet night. Replaces the game's flat sky/fog color (the same color also
; fades distant geometry), keeping weather by leaving grey skies alone.
[SkyPalette]
Enabled=true
Strength=0.85
